<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Ayush Narkhede</title>
  <style>
    :root { --bg:#0f1115; --card:#181b22; --text:#e8eaed; --muted:#9aa0a6; --accent:#8ab4f8; --border:#2a2f3a; --ok:#81c995; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
           background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh;
           display: flex; flex-direction: column; align-items: center; padding: 48px 20px 64px; }
    .wrap { max-width: 480px; width: 100%; }
    h1 { font-size: 1.6rem; margin-bottom: 6px; }
    .sub { color: var(--muted); margin-bottom: 28px; font-size: 0.95rem; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; margin-top: 14px; }
    label:first-of-type { margin-top: 0; }
    input, textarea {
      width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
      background: #12151c; color: var(--text); font-size: 16px; font-family: inherit;
    }
    input:focus, textarea:focus { outline: none; border-color: var(--accent); }
    textarea { min-height: 110px; resize: vertical; }
    button {
      margin-top: 18px; width: 100%; min-height: 48px; padding: 12px; border: none; border-radius: 8px;
      background: var(--accent); color: #0f1115; font-weight: 600; font-size: 0.95rem; cursor: pointer;
    }
    button:hover { opacity: 0.92; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg { margin-top: 14px; font-size: 0.9rem; display: none; }
    .msg.ok { color: var(--ok); display: block; }
    .msg.err { color: #f28b82; display: block; }
    a { color: var(--accent); }
    footer { margin-top: 24px; font-size: 0.85rem; color: var(--muted); text-align: center; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Contact</h1>
    <p class="sub">One message. It reaches me by email. No spam, no account required.</p>

    <div class="card">
      <!-- 
        HOW TO ACTIVATE (2 minutes):
        1. Go to https://web3forms.com  (or formspree.io)
        2. Enter your email → copy the Access Key
        3. Replace 2e609fac-4eb2-49e9-9948-9eb6b837f981 below with that key
        4. Push / redeploy — then submit a real test from this page
      -->
      <form id="contact-form" action="https://api.web3forms.com/submit" method="POST">
        <input type="hidden" name="access_key" value="2e609fac-4eb2-49e9-9948-9eb6b837f981" />
        <input type="hidden" name="subject" value="Portfolio contact — ayushdevxx" />
        <input type="checkbox" name="botcheck" style="display:none" />

        <label for="name">Name</label>
        <input id="name" type="text" name="name" required placeholder="Your name" />

        <label for="email">Email</label>
        <input id="email" type="email" name="email" required placeholder="you@example.com" />

        <label for="message">Message</label>
        <textarea id="message" name="message" required placeholder="What do you want to talk about?"></textarea>

        <button type="submit" id="submit-btn">Send message</button>
        <p class="msg" id="form-msg"></p>
      </form>
    </div>

    <footer>
      <a href="https://ayushdevxx.vercel.app/">← Back to portfolio</a>
      · Hosted free · Form backend via Web3Forms
    </footer>
  </div>

  <script>
    const form = document.getElementById("contact-form");
    const btn = document.getElementById("submit-btn");
    const msg = document.getElementById("form-msg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const key = form.querySelector('[name="access_key"]').value;
      if (!key || key === "2e609fac-4eb2-49e9-9948-9eb6b837f981") {
        msg.className = "msg err";
        msg.textContent = "Form not activated yet — replace 2e609fac-4eb2-49e9-9948-9eb6b837f981 with your free Web3Forms key (see page source comment).";
        return;
      }
      btn.disabled = true;
      btn.textContent = "Sending…";
      msg.className = "msg";
      msg.textContent = "";

      try {
        const res = await fetch(form.action, {
          method: "POST",
          body: new FormData(form),
          headers: { Accept: "application/json" }
        });
        const data = await res.json();
        if (res.ok && data.success) {
          msg.className = "msg ok";
          msg.textContent = "Sent. Check your inbox — a real submission reached you.";
          form.reset();
        } else {
          throw new Error(data.message || "Submit failed");
        }
      } catch (err) {
        msg.className = "msg err";
        msg.textContent = "Could not send. Check the access key and try again.";
      } finally {
        btn.disabled = false;
        btn.textContent = "Send message";
      }
    });
  </script>
</body>
</html>
